name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx scikit-learn pytest ruff
      - run: ruff check assistants.py Task0.py Task1.py Task2.py tests
      - run: ruff format --check assistants.py Task0.py Task1.py Task2.py tests
      - run: pytest -q
