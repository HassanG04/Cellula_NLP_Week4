[project]
name = "nlp-assistant-patterns"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "scikit-learn>=1.4,<2"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
extend-select = ["I"]
